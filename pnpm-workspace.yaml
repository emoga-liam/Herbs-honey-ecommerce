packages:
  - 'artifacts/*'
  - 'lib/*'
  - 'lib/integrations/*'
  - 'scripts'

# pnpm 11: allowBuilds replaces onlyBuiltDependencies.
# Without this, Hostinger install fails with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: true
  '@firebase/util': true
  protobufjs: true

# Hostinger-critical: hoisted layout avoids EACCES on symlink binaries.
# pnpm 11 reads these from pnpm-workspace.yaml (not .npmrc).
nodeLinker: hoisted
managePackageManagerVersions: false
minimumReleaseAge: 0
