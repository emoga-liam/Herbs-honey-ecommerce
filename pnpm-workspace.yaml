packages:
  - 'artifacts/*'
  - 'lib/*'
  - 'lib/integrations/*'
  - 'scripts'

# Force Hostinger-safe versions (vuln scanner)
overrides:
  esbuild: 0.28.1
  js-yaml: '>=4.3.1'

# pnpm 11: allowBuilds replaces onlyBuiltDependencies.
# Without this, Hostinger install fails with ERR_PNPM_IGNORED_BUILDS.
#
# esbuild is explicitly false: its postinstall spawnSync(bin/esbuild) hits
# EACCES on Hostinger. Platform optional packages still install; we chmod
# binaries in scripts/fix-esbuild-bins.mjs (postinstall + build).
allowBuilds:
  esbuild: false
  '@firebase/util': true
  protobufjs: true

# Hostinger-critical: hoisted layout avoids EACCES on symlink binaries.
# pnpm 11 reads these from pnpm-workspace.yaml (not .npmrc).
nodeLinker: hoisted
managePackageManagerVersions: false
minimumReleaseAge: 0
