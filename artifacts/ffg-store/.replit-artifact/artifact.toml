kind = "web"
previewPath = "/"
title = "FFG Foods Store"
version = "1.0.0"
id = "artifacts/ffg-store"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22825

[services.development]
run = "yarn workspace @workspace/ffg-store dev"

[services.production]
build = [ "yarn", "workspace", "@workspace/ffg-store", "build" ]
publicDir = "artifacts/ffg-store/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22825"
BASE_PATH = "/"
